<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-lang-fa="صفحه کاربری" data-lang-en="Profile">صفحه کاربری</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body dir="rtl">
  <header class="header container">
    <div class="brand" data-lang-fa="وبسایت پوپ" data-lang-en="Pop Game">وبسایت پوپ</div>
    <div class="lang-wrap">
      <label for="language-selector" data-lang-fa="زبان" data-lang-en="Language">زبان</label>
      <select id="language-selector">
        <option value="fa">فارسی</option>
        <option value="en">English</option>
      </select>
    </div>
  </header>

  <div class="container dashboard-container">
    <nav class="sidebar">
      <h2 data-lang-fa="منوی سایت" data-lang-en="Site Menu">منوی سایت</h2>
      <ul>
        <li><a href="dashboard.html" data-lang-fa="صفحه اصلی" data-lang-en="Home">صفحه اصلی</a></li>
        <li><a href="profile.html" class="active" data-lang-fa="صفحه کاربری" data-lang-en="Profile">صفحه کاربری</a></li>
        <li><a href="contact.html" data-lang-fa="ارتباط با ما" data-lang-en="Contact">ارتباط با ما</a></li>
        <li><a href="games.html" data-lang-fa="بازی‌ها" data-lang-en="Games">بازی‌ها</a></li>
        <li><a href="login.html" data-lang-fa="خروج" data-lang-en="Logout">خروج</a></li>
      </ul>
    </nav>

    <main class="main-content">
      <div class="profile-card panel" style="max-width:360px">
        <img src="https://via.placeholder.com/100" alt="avatar" style="border-radius:50%;display:block;margin:0 auto 12px">
        <h2 data-lang-fa="نام کاربر" data-lang-en="User Name">نام کاربر</h2>
        <p data-lang-fa="ایمیل: example@email.com" data-lang-en="Email: example@email.com">
          ایمیل: example@email.com
        </p>
        <p data-lang-fa="برترین امتیاز: 0" data-lang-en="Top score: 0">برترین امتیاز: 0</p>
        <button data-lang-fa="ویرایش اطلاعات" data-lang-en="Edit profile">ویرایش اطلاعات</button>
      </div>
    </main>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
