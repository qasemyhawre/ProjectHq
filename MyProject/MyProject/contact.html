<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="css/style.css">
</head>
<body dir="rtl">
  <header class="header container">
    <div class="brand" data-lang-fa="وبسایت پوپ" data-lang-en="Pop Game">وبسایت پوپ</div>
    <div class="lang-wrap">
      <label for="language-selector" data-lang-fa="زبان" data-lang-en="Language">زبان</label>
      <select id="language-selector">
        <option value="fa">فارسی</option>
        <option value="en">English</option>
      </select>
    </div>
  </header>

  <div class="container dashboard-container">
    <nav class="sidebar">
      <h2 data-lang-fa="منوی سایت" data-lang-en="Site Menu">منوی سایت</h2>
      <ul>
        <li><a href="dashboard.html" data-lang-fa="صفحه اصلی" data-lang-en="Home">صفحه اصلی</a></li>
        <li><a href="profile.html" data-lang-fa="صفحه کاربری" data-lang-en="Profile">صفحه کاربری</a></li>
        <li><a href="contact.html" class="active" data-lang-fa="ارتباط با ما" data-lang-en="Contact">ارتباط با ما</a></li>
        <li><a href="games.html" data-lang-fa="بازی‌ها" data-lang-en="Games">بازی‌ها</a></li>
        <li><a href="login.html" data-lang-fa="خروج" data-lang-en="Logout">خروج</a></li>
      </ul>
    </nav>

    <main class="main-content">
      <div class="contact-form panel" style="max-width:520px">
        <h1 data-lang-fa="ارتباط با ما" data-lang-en="Contact us">ارتباط با ما</h1>
        <input type="text" data-placeholder-fa="نام شما" data-placeholder-en="Your name" placeholder="نام شما" required>
        <input type="email" data-placeholder-fa="ایمیل" data-placeholder-en="Your email" placeholder="ایمیل" required>
        <textarea rows="6" data-placeholder-fa="پیام شما..." data-placeholder-en="Your message..." placeholder="پیام شما..." required></textarea>
        <button data-value-fa="ارسال پیام" data-value-en="Send message">ارسال پیام</button>
      </div>
    </main>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
