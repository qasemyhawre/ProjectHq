<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به حساب کاربری</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1e5799 0%, #207cca 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        
        .login-header {
            background: linear-gradient(135deg, #1e5799 0%, #207cca 100%);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }
        
        .login-header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }
        
        .login-form {
            padding: 25px 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.3s;
            outline: none;
        }
        
        .form-group input:focus {
            border-color: #1e5799;
            box-shadow: 0 0 0 2px rgba(30, 87, 153, 0.2);
        }
        
        .captcha-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .captcha-box {
            flex: 1;
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 3px;
        }
        
        .captcha-refresh {
            background: none;
            border: none;
            color: #1e5799;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
        }
        
        .separator {
            height: 1px;
            background-color: #eee;
            margin: 25px 0;
            position: relative;
        }
        
        .separator::before {
            content: "شرکت";
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 0 15px;
            color: #777;
            font-size: 14px;
        }
        
        .company-logo {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 22px;
            color: #1e5799;
            letter-spacing: 2px;
        }
        
        .login-button {
            background: linear-gradient(135deg, #1e5799 0%, #207cca 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 15px;
        }
        
        .login-button:hover {
            background: linear-gradient(135deg, #18467e 0%, #1c6cb3 100%);
            box-shadow: 0 5px 15px rgba(30, 87, 153, 0.3);
        }
        
        .login-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .login-links a {
            color: #1e5799;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        
        .login-links a:hover {
            color: #18467e;
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .login-form {
                padding: 20px;
            }
            
            .login-links {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>ورود به حساب کاربری</h1>
        </div>
        
        <form class="login-form">
            <div class="form-group">
                <label for="email">ایمیل</label>
                <input type="email" id="email" placeholder="آدرس ایمیل خود را وارد کنید">
            </div>
            
            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" placeholder="رمز عبور خود را وارد کنید">
            </div>
            
            <div class="form-group">
                <label for="captcha">کد امنیتی</label>
                <div class="captcha-container">
                    <input type="text" id="captcha" placeholder="کد امنیتی را وارد کنید">
                    <div class="captcha-box">A3B7C</div>
                    <button type="button" class="captcha-refresh">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>
            
            <div class="separator"></div>
            
            <div class="company-logo">TnZCh</div>
            
            <button type="submit" class="login-button">ورود به حساب کاربری</button>
            
            <div class="login-links">
                <a href="#">بازیابی رمز عبور</a>
                <a href="#">ثبت نام در سایت</a>
            </div>
        </form>
    </div>

    <script>
        // تولید کد امنیتی تصادفی
        function generateCaptcha() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let captcha = '';
            for (let i = 0; i < 5; i++) {
                captcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.querySelector('.captcha-box').textContent = captcha;
        }
        
        // رویداد کلیک برای دکمه به‌روزرسانی کد امنیتی
        document.querySelector('.captcha-refresh').addEventListener('click', generateCaptcha);
        
        // تولید کد امنیتی اولیه
        generateCaptcha();
    </script>
</body>
</html>
